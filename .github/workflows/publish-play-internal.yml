name: Publish shipping AAB to Play internal testing

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Must be greater than the latest version code in Google Play
        required: true
        type: number

permissions:
  contents: read
  id-token: write

concurrency:
  group: google-play-internal-publish
  cancel-in-progress: false

jobs:
  publish-internal:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment: play-internal
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK packages
        uses: android-actions/setup-android@v4

      - name: Install Android platform and build tools
        run: sdkmanager 'platforms/android-36' 'build-tools/35.0.0' 'platform-tools'

      - name: Run core tests
        run: bash tests/run-core-tests.sh

      - name: Install Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install pinned Fastlane version
        run: gem install fastlane --no-document --version 2.241.2

      - name: Check required publishing secrets
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          CHOPTORCH_MODEL_JSON: ${{ secrets.CHOPTORCH_MODEL_JSON }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_UPLOAD_KEYSTORE_BASE64" || { echo "::error::Missing ANDROID_UPLOAD_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$ANDROID_UPLOAD_KEYSTORE_PASSWORD" || { echo "::error::Missing ANDROID_UPLOAD_KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$ANDROID_UPLOAD_KEY_ALIAS" || { echo "::error::Missing ANDROID_UPLOAD_KEY_ALIAS secret"; exit 1; }
          test -n "$ANDROID_UPLOAD_KEY_PASSWORD" || { echo "::error::Missing ANDROID_UPLOAD_KEY_PASSWORD secret"; exit 1; }
          test -n "$CHOPTORCH_MODEL_JSON" || { echo "::error::Missing CHOPTORCH_MODEL_JSON repository secret"; exit 1; }
          test -n "$GCP_WORKLOAD_IDENTITY_PROVIDER" || { echo "::error::Missing GCP_WORKLOAD_IDENTITY_PROVIDER environment variable"; exit 1; }
          test -n "$GCP_SERVICE_ACCOUNT" || { echo "::error::Missing GCP_SERVICE_ACCOUNT environment variable"; exit 1; }

      - name: Prepare upload signing key
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/choptorch-upload-key.jks"
          echo "ANDROID_UPLOAD_KEYSTORE_PATH=$RUNNER_TEMP/choptorch-upload-key.jks" >> "$GITHUB_ENV"

      - name: Restore private shipping model
        env:
          CHOPTORCH_MODEL_JSON: ${{ secrets.CHOPTORCH_MODEL_JSON }}
        run: |
          set -euo pipefail
          printf '%s' "$CHOPTORCH_MODEL_JSON" > app/src/main/assets/choptorch_model.json

      - name: Build signed shipping bundle
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: bash ./gradlew --no-daemon --stacktrace bundleRelease -Pshipping=true -PversionCode="$VERSION_CODE"

      - name: Authenticate to Google Play with Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Upload bundle to internal testing
        run: >-
          fastlane supply
          --aab app/build/outputs/bundle/release/app-release.aab
          --package_name com.barbarioli1.choptorch
          --track internal
          --release_status completed
          --json_key "$GOOGLE_APPLICATION_CREDENTIALS"
          --skip_upload_metadata true
          --skip_upload_changelogs true
          --skip_upload_images true
          --skip_upload_screenshots true

      - name: Remove temporary credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/choptorch-upload-key.jks"
