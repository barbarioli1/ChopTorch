name: Publish shipping APK to GitHub Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v2.2.1
        required: true
        type: string
      release_notes:
        description: Markdown text to include in the public GitHub Release
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: choptorch-version-code-allocation
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment: play-internal
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK packages
        uses: android-actions/setup-android@v4

      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'

      - name: Validate release inputs
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+(\.[0-9]+)?)$ ]]; then
            echo '::error::Tag must use vMAJOR.MINOR or vMAJOR.MINOR.PATCH format.'
            exit 1
          fi
          version_name="${BASH_REMATCH[1]}"
          if [[ -z "${RELEASE_NOTES//[[:space:]]/}" ]]; then
            echo '::error::Release notes cannot be empty.'
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Tag $RELEASE_TAG already exists. Choose a new release tag."
            exit 1
          fi
          echo "VERSION_NAME=$version_name" >> "$GITHUB_ENV"

      - name: Run core tests
        run: bash tests/run-core-tests.sh

      - name: Check required publishing configuration
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          CHOPTORCH_MODEL_JSON: ${{ secrets.CHOPTORCH_MODEL_JSON }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_UPLOAD_KEYSTORE_BASE64" || { echo '::error::Missing upload signing configuration'; exit 1; }
          test -n "$ANDROID_UPLOAD_KEYSTORE_PASSWORD" || { echo '::error::Missing upload signing configuration'; exit 1; }
          test -n "$ANDROID_UPLOAD_KEY_ALIAS" || { echo '::error::Missing upload signing configuration'; exit 1; }
          test -n "$ANDROID_UPLOAD_KEY_PASSWORD" || { echo '::error::Missing upload signing configuration'; exit 1; }
          test -n "$CHOPTORCH_MODEL_JSON" || { echo '::error::Missing shipping model configuration'; exit 1; }
          test -n "$GCP_WORKLOAD_IDENTITY_PROVIDER" || { echo '::error::Missing Play version lookup configuration'; exit 1; }
          test -n "$GCP_SERVICE_ACCOUNT" || { echo '::error::Missing Play version lookup configuration'; exit 1; }

      - name: Prepare upload signing key
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/choptorch-upload-key.jks"
          echo "ANDROID_UPLOAD_KEYSTORE_PATH=$RUNNER_TEMP/choptorch-upload-key.jks" >> "$GITHUB_ENV"

      - name: Restore shipping model
        env:
          CHOPTORCH_MODEL_JSON: ${{ secrets.CHOPTORCH_MODEL_JSON }}
        run: |
          set -euo pipefail
          printf '%s' "$CHOPTORCH_MODEL_JSON" > app/src/main/assets/choptorch_model.json

      - name: Authenticate to Google Play for version lookup
        id: auth-for-version-lookup
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      - name: Select next version code
        env:
          PLAY_API_TOKEN: ${{ steps.auth-for-version-lookup.outputs.access_token }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PACKAGE_NAME: com.barbarioli1.choptorch
        run: |
          set -euo pipefail
          api="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PACKAGE_NAME"
          edit_id=''
          cleanup_edit() {
            if [[ -n "$edit_id" ]]; then
              curl --silent --show-error --request DELETE \
                --header "Authorization: Bearer $PLAY_API_TOKEN" \
                "$api/edits/$edit_id" >/dev/null || true
            fi
          }
          trap cleanup_edit EXIT

          edit=$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $PLAY_API_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{}' \
            "$api/edits")
          edit_id=$(jq --exit-status --raw-output '.id' <<< "$edit")
          tracks=$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $PLAY_API_TOKEN" \
            "$api/edits/$edit_id/tracks")
          latest_code=$(jq --exit-status --raw-output \
            '[.tracks[]?.releases[]?.versionCodes[]? | tonumber] | max // 0' <<< "$tracks")
          latest_github_code=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].body // ""' \
            | grep --only-matching --extended-regexp '<!-- choptorch-version-code: [0-9]+ -->' \
            | grep --only-matching --extended-regexp '[0-9]+' \
            | sort --numeric-sort | tail --lines=1 || true)
          latest_github_code=${latest_github_code:-0}
          if (( latest_github_code > latest_code )); then latest_code=$latest_github_code; fi
          if (( latest_code >= 2100000000 )); then
            echo "::error::The highest release version code ($latest_code) has reached Android's limit."
            exit 1
          fi
          version_code=$(( latest_code + 1 ))
          if (( version_code < 5 )); then version_code=5; fi

          echo "VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          {
            echo '### APK release version'
            echo "Tag: $RELEASE_TAG"
            echo "Version code: $version_code (next after Play and GitHub releases)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Selected version code $version_code."
          curl --fail-with-body --silent --show-error \
            --request DELETE \
            --header "Authorization: Bearer $PLAY_API_TOKEN" \
            "$api/edits/$edit_id" >/dev/null
          edit_id=''

      - name: Build signed shipping APK
        env:
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: >-
          bash ./gradlew --no-daemon --stacktrace assembleRelease
          -Pshipping=true
          -PversionCode="$VERSION_CODE"
          -PversionName="$VERSION_NAME"

      - name: Verify signed APK
        run: >-
          "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Publish APK and release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          APK_VERSION_NAME="$VERSION_NAME"
          APK_VERSION_CODE="$VERSION_CODE"
          notes_file="$RUNNER_TEMP/release-notes.md"
          {
            printf '%s\n\n' "$RELEASE_NOTES"
            printf '<!-- choptorch-version-code: %s -->\n' "$APK_VERSION_CODE"
          } > "$notes_file"
          gh release create "$RELEASE_TAG" app/build/outputs/apk/release/app-release.apk \
            --title "ChopTorch $APK_VERSION_NAME" \
            --notes-file "$notes_file" \
            --target "$GITHUB_SHA"
          release_url="https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
          {
            echo '### GitHub Release published'
            echo "Release: $release_url"
            echo "APK version code: $APK_VERSION_CODE"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/choptorch-upload-key.jks"