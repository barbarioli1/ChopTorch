name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK command-line tools
        uses: android-actions/setup-android@v4

      - name: Install Android platform API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'

      - name: Restore private model and training samples
        env:
          CHOPTORCH_MODEL_JSON: ${{ secrets.CHOPTORCH_MODEL_JSON }}
          CHOPTORCH_SEED_EXAMPLES_JSON: ${{ secrets.CHOPTORCH_SEED_EXAMPLES_JSON }}
        run: |
          set -euo pipefail
          test -n "$CHOPTORCH_MODEL_JSON" || { echo "::error::Missing CHOPTORCH_MODEL_JSON repository secret"; exit 1; }
          test -n "$CHOPTORCH_SEED_EXAMPLES_JSON" || { echo "::error::Missing CHOPTORCH_SEED_EXAMPLES_JSON repository secret"; exit 1; }
          printf '%s' "$CHOPTORCH_MODEL_JSON" > app/src/main/assets/choptorch_model.json
          printf '%s' "$CHOPTORCH_SEED_EXAMPLES_JSON" > app/trainingAssets/choptorch_seed_examples.json

      - name: Test sensor fusion and gesture classifier
        run: bash tests/run-core-tests.sh

      - name: Compile development debug APK
        run: bash ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload development debug APK
        uses: actions/upload-artifact@v4
        if: github.event.repository.private == true
        with:
          name: ChopTorch-development-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Compile shipping debug APK
        run: bash ./gradlew --no-daemon --stacktrace assembleDebug -Pshipping=true

      - name: Upload shipping debug APK
        uses: actions/upload-artifact@v4
        if: github.event.repository.private == true
        with:
          name: ChopTorch-shipping-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
